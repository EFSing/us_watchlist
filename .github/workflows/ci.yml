name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install from source
        run: python -m pip install --no-cache-dir ".[yahoo]"
      - name: Run tests and architecture checks
        run: python -m unittest discover -s tests -v
      - name: Run installed CLI twice
        run: |
          us-watchlist smoke
          us-watchlist smoke
          us-watchlist b-offline
          us-watchlist b-offline
      - name: Check generated files and whitespace
        run: git diff --check
