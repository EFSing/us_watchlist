name: US IWB B+C Daily

on:
  schedule:
    - cron: '37 17 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      trade_date:
        description: 'Completed XNYS session YYYY-MM-DD, empty for latest'
        type: string
      holdings_date:
        description: 'Exact official holdings date YYYY-MM-DD for historical recovery'
        type: string

permissions:
  actions: read
  contents: read

jobs:
  daily:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'schedule' && vars.US_IWB_SCHEDULE_ENABLED == 'true')
    concurrency:
      group: us-iwb-bc-canonical-publisher
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      trade_date: ${{ steps.daily.outputs.target }}
      report_status: ${{ steps.daily.outputs.status }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --no-cache-dir ".[yahoo]"
      - name: Restore prior evidence and observe the session
        id: daily
        env:
          GH_TOKEN: ${{ github.token }}
          IWB_DEFAULT_BRANCH: ${{ github.ref_name }}
          REQUESTED_TRADE_DATE: ${{ inputs.trade_date }}
          REQUESTED_HOLDINGS_DATE: ${{ inputs.holdings_date }}
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            if [[ -n "$REQUESTED_TRADE_DATE" ]]; then args+=(--trade-date "$REQUESTED_TRADE_DATE"); fi
            if [[ -n "$REQUESTED_HOLDINGS_DATE" ]]; then args+=(--holdings-date "$REQUESTED_HOLDINGS_DATE"); fi
          fi
          us-watchlist iwb-automation --workspace "$RUNNER_TEMP/iwb-${GITHUB_RUN_ATTEMPT}" \
            --event "$GITHUB_EVENT_NAME" --code-sha "$GITHUB_SHA" "${args[@]}"
      - name: Archive the new validated IWB version
        if: ${{ !cancelled() && steps.daily.outputs.pool_file != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.daily.outputs.pool_name }}
          path: ${{ steps.daily.outputs.pool_file }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Publish the canonical B+C observation
        if: ${{ success() && steps.daily.outputs.report_dir != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.daily.outputs.report_name }}
          path: ${{ steps.daily.outputs.report_dir }}/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve attempt state and failed evidence
        if: ${{ !cancelled() && steps.daily.outputs.diagnostic_receipt != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: us-iwb-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.daily.outputs.diagnostic_receipt }}
            ${{ steps.daily.outputs.diagnostic_attempt_1 }}
            ${{ steps.daily.outputs.diagnostic_attempt_2 }}
          if-no-files-found: error
          retention-days: 7
      - name: Email the verified B+C report
        if: ${{ success() && steps.daily.outputs.email_report_dir != '' }}
        env:
          IWB_EMAIL_DIR: ${{ steps.daily.outputs.email_report_dir }}
          IWB_TRADE_DATE: ${{ steps.daily.outputs.target }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
        run: us-watchlist iwb-email --directory "$IWB_EMAIL_DIR" --trade-date "$IWB_TRADE_DATE"

  notify-failure:
    if: ${{ always() && needs.daily.result == 'failure' }}
    needs: daily
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Send Bark when collection, publication, or mail fails
        env:
          BARK_ENDPOINT: ${{ secrets.BARK_ENDPOINT }}
          IWB_TRADE_DATE: ${{ needs.daily.outputs.trade_date }}
          IWB_REPORT_STATUS: ${{ needs.daily.outputs.report_status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          endpoint = os.environ.get("BARK_ENDPOINT", "").strip()
          if not endpoint:
              raise SystemExit("IWB_BARK_NOT_CONFIGURED")
          run_url = (f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                     f"/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          target = os.environ.get("IWB_TRADE_DATE") or "未确定"
          stage = os.environ.get("IWB_REPORT_STATUS") or "未取得状态"
          payload = {"title": "美股 IWB B+C 日报故障",
                     "body": f"交易日：{target}；日报状态：{stage}。采集、归档或邮件未完成，请检查 Actions。",
                     "url": run_url}
          request = Request(endpoint, data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                            headers={"Content-Type": "application/json; charset=utf-8"}, method="POST")
          try:
              with urlopen(request, timeout=20) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if isinstance(result, dict) and result.get("code") not in (None, 200, 0):
                  raise ValueError("Bark rejected the push")
          except Exception as error:
              raise SystemExit(f"IWB_BARK_SEND_FAILED {type(error).__name__}") from None
          print("IWB_BARK_SENT")
          PY
